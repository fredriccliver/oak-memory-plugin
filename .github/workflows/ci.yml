name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify committed bundles are synchronized
        run: |
          cmp dist/index.mjs plugins/oak-memory/dist/index.mjs
          cmp dist/hook.mjs plugins/oak-memory/dist/hook.mjs
      - run: npm run check:cloud-plugin
      - run: npm run package:cloud:openai
      - run: npm run package:cloud:claude
      - run: npm test
      - run: npm run test:desktop
      - run: npm run package:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: oak-desktop-cloud
          path: artifacts/*.mcpb
      - name: Verify generated bundles remain synchronized
        run: |
          cmp dist/index.mjs plugins/oak-memory/dist/index.mjs
          cmp dist/hook.mjs plugins/oak-memory/dist/hook.mjs
      - uses: ./.github/actions/test-postgres
        with:
          port: '55437'
          password: oak-disposable-test
      - name: Verify local merge through real stdio
        env:
          PGPASSWORD: oak-disposable-test
          OAK_MERGE_TEST_DATABASE_URL: postgresql://postgres:oak-disposable-test@127.0.0.1:55437/oak_stdio_merge_test
        run: |
          createdb -h 127.0.0.1 -p 55437 -U postgres oak_stdio_merge_test
          npm run test:merge-stdio
