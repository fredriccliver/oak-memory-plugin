name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify committed bundles are synchronized
        run: |
          cmp dist/index.mjs plugins/oak-memory/dist/index.mjs
          cmp dist/hook.mjs plugins/oak-memory/dist/hook.mjs
      - run: npm run build
      - name: Verify generated bundles remain synchronized
        run: |
          cmp dist/index.mjs plugins/oak-memory/dist/index.mjs
          cmp dist/hook.mjs plugins/oak-memory/dist/hook.mjs
